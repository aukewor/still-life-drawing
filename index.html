<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Still life drawing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="canvas">
        <div id="tabletop"></div>
        <div id="book">
            <div id="book-top"></div>
        </div>
        <div id="jug">
            <div id="jug-body"></div>
            <div id="jug-spout"></div>
            <div id="flower">
                <div id="stem"></div>
                <div class="petal" id="petal-a"></div>
                <div class="petal" id="petal-b"></div>
                <div class="petal" id="petal-c"></div>
                <div class="petal" id="petal-d"></div>
                <div class="stamen" id="stamen-a"></div>
                <div class="stamen" id="stamen-b"></div>
                <div class="stamen" id="stamen-c"></div>
            </div>
            <div id="jug-handle"></div>
        </div>
        <div id="lamp">
            <div id="lamp-top"></div>
            <div id="lamp-bottom"></div>
        </div>
        <div id="timer">
            <div id="timer-side"></div>
            <div id="timer-front">
                <div id="timer-knob">
                    <div id="timer-knob-side"></div>
                    <div id="timer-knob-front"></div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
